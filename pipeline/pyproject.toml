[project]
name = "pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.4.0",
    "cohere>=7.1.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "sentence-transformers>=6.0.1",
    "tenacity>=9.1.4",
    "typer>=0.27.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "respx>=0.22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# A paridade carrega o modelo de verdade e fica fora da suíte rápida. Ela
# roda antes de publicar o catálogo: `pytest -m paridade`.
markers = ["paridade: compara vetores dos dois runtimes; carrega o modelo real"]
addopts = "-m 'not paridade'"
