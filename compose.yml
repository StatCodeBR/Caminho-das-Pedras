# Publicação no Dokploy, atrás do Traefik.
#
# Só o `web` tem domínio. A `api` fica na rede interna e é alcançada por
# `http://api:8000`: ela não precisa de CORS, o endereço dela não vai ao
# navegador, e nenhuma rota do serviço de resposta fica exposta na internet.

services:
  api:
    build:
      # A raiz, não `api/`: a imagem precisa do dados.db gerado em `pipeline/`.
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      # Sem chave o serviço ainda sobe e responde: template e modo reduzido não
      # dependem do modelo. Só a redação cai.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODO_STUB: ${MODO_STUB:-0}
      MODELO: ${MODELO:-claude-haiku-4-5}
      # Os limiares de roteamento não estão aqui de propósito. Eles são
      # resultado de medição sobre o conjunto de avaliação, e medição pertence
      # ao repositório: o padrão vive em `api/app/configuracao.py`, junto da
      # tabela que o justifica. Repetir os números aqui criava duas fontes de
      # verdade, e elas divergiram — o compose fixava 20 e 3 enquanto o código
      # já dizia 35 e 12, e o ambiente vence o padrão. A produção rodou semanas
      # com a calibração da amostra de 505 fichas sem ninguém notar.
      #
      # Para sobrepor deliberadamente, defina LIMIAR_TEMPLATE, MARGEM_TEMPLATE
      # ou LIMIAR_RELEVANCIA no ambiente do serviço. Não os declare vazios: o
      # serviço não converte "" em número e não sobe.
      # Contenção de consumo. O teto nunca produz erro: ao estourar, as
      # respostas passam a sair por template.
      ESTADO_DIR: /estado
      TETO_DIARIO_MODELO: ${TETO_DIARIO_MODELO:-400}
      LIMITE_ORIGEM_MAXIMO: ${LIMITE_ORIGEM_MAXIMO:-20}
      LIMITE_ORIGEM_JANELA: ${LIMITE_ORIGEM_JANELA:-3600}
    volumes:
      # O contador precisa sobreviver a reinício: um teto de gasto que zera a
      # cada deploy não é teto. Fica fora do dados.db, que é somente leitura.
      - estado:/estado
    # `expose` e não `ports`: alcançável só de dentro da rede, nunca do host.
    expose:
      - "8000"
    networks:
      - interna
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys,json; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/saude', timeout=4)); sys.exit(0 if r.get('ok') else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Nome do serviço na rede interna: o navegador nunca vê este endereço.
      API_URL: http://api:8000
      # O adapter-node exige ORIGIN para validar POST; sem isso o envio da
      # pergunta é recusado como falsificação de origem.
      ORIGIN: ${ORIGIN:?defina ORIGIN com a URL pública, ex. https://caminho.exemplo.br}
      # De onde sai o endereço do visitante. O adapter-node lê o X-Forwarded-For
      # da DIREITA, contando XFF_DEPTH proxies confiáveis — a direção que o
      # cliente não controla. Errar o número é grave nos dois sentidos:
      #
      #   só Traefik            XFF: <cliente>              -> XFF_DEPTH=1
      #   Cloudflare + Traefik  XFF: <cliente>, <cloudflare> -> XFF_DEPTH=2
      #
      # Com Cloudflare e XFF_DEPTH=1, o limite contaria a Cloudflare como
      # origem: todos os visitantes viram um endereço só e o serviço se
      # autolimita em 20 perguntas por hora no mundo inteiro.
      #
      # Havendo Cloudflare, prefira ADDRESS_HEADER=cf-connecting-ip: valor
      # único, escrito por ela, sem lista onde injetar nada.
      ADDRESS_HEADER: ${ADDRESS_HEADER:-x-forwarded-for}
      XFF_DEPTH: ${XFF_DEPTH:-1}
    depends_on:
      api:
        # Espera o catálogo estar legível: subir a tela antes só produziria
        # erro na primeira pergunta.
        condition: service_healthy
    expose:
      - "3000"
    networks:
      - interna
      - dokploy-network
    labels:
      traefik.enable: "true"
      traefik.docker.network: dokploy-network
      traefik.http.services.caminho-web.loadbalancer.server.port: "3000"
      traefik.http.routers.caminho-web.rule: Host(`${DOMINIO:?defina DOMINIO}`)
      traefik.http.routers.caminho-web.entrypoints: websecure
      traefik.http.routers.caminho-web.tls.certresolver: letsencrypt

volumes:
  estado:

networks:
  interna:
    driver: bridge
  dokploy-network:
    external: true
